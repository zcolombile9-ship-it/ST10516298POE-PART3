# Runs every JUnit test in the project each time code is pushed to GitHub
name: TestJava

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Download the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compile the project and run all unit tests (Task and Main)
      - name: Run unit tests
        run: mvn -B test
